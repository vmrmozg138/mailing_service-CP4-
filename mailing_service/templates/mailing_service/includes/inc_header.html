<a class="navbar-brand" href="#">Fixed navbar</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarCollapse">
    <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'mailing_service:main_page' %}">Home</a>
        </li>
        <li class="nav-item">
            <a href="{% url 'mailing_service:about' %}" class="btn btn-outline-secondary">
                О сервисе
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </li>
    </ul>
    <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
</div>
<ul class="navbar-nav ml-auto">
{% if user.is_authenticated %}
    <li class="nav-item">
        <div class="d-flex align-items-center">
            <span class="navbar-text me-2">Добро пожаловать, {{ user.email }}!</span>
            <form method="post" action="{% url 'users:logout' %}" class="d-flex m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-link nav-link p-0 me-3">Выйти</button>
            </form>
        </div>
    </li>
{% else %}
    <li class="nav-item">
        <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
    </li>
{% endif %}
</ul>
